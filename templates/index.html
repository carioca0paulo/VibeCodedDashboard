<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" id="manifest-link" href="/manifest.json">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Tela de escolha de seção (só aparece se houver mais de uma seção
       e este aparelho ainda não tiver escolhido uma) -->
  <div id="chooser" class="chooser" style="display:none">
    <div class="chooser-card">
      <h1 id="chooser-title">Qual tela é essa?</h1>
      <p id="chooser-subtitle">Escolha a seção que este aparelho deve mostrar.</p>
      <div id="chooser-list" class="chooser-list"></div>
    </div>
  </div>

  <!-- Dashboard de exibição -->
  <div id="display-root" style="display:none">
    <div id="bg-container">
      <img id="bg-image" class="bg-media" alt="">
      <video id="bg-video" class="bg-media" autoplay muted loop playsinline></video>
    </div>

    <div id="overlay">
      <div id="weather-widget" class="widget">
        <div id="weather-icon">--</div>
        <div id="weather-temp">--°</div>
        <div id="weather-loc"></div>
      </div>
      <div id="clock-widget" class="widget">
        <div id="clock">--:--</div>
      </div>
      <div id="date-widget" class="widget">
        <div id="date">--</div>
      </div>
    </div>

    <button id="fullscreen-btn" title="Tela cheia">
      <svg id="icon-expand" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <svg id="icon-compress" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
        <path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
      </svg>
    </button>

    <a id="change-section-link" class="change-section-link" href="#">Trocar dispositivo</a>
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/fonts.js"></script>
  <script src="/static/js/display.js"></script>
</body>
</html>
